[package]
name = "dev"
version = "0.1.0"
edition = "2024"
description = "A task-oriented development control plane for Git worktrees, tmux, and Codex"
license = "MIT"

[[bin]]
name = "dev"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
